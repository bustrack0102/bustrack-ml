name: CI PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: black --check src
      - run: flake8 src
      - name: Pytest
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No se recolectaron pruebas (esqueleto); se omite el fallo."
            exit 0
          fi
          exit "$code"
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
